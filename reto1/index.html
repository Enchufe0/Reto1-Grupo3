<body>

    <!-- NAVBAR (Hidden by default) -->

        <div class="nav-tabs">
            <a href="index.html?page=equipamientos" class="nav-link" data-page="equipamientos">Equipamiento</a>
            <a href="index.html?page=ubicaciones" class="nav-link" data-page="ubicaciones" id="nav-ubicaciones" style="display:none;">Ubicaciones</a>
