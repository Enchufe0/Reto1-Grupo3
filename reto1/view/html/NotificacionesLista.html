<!DOCTYPE html>
<html lang="es">
    <head lang="es">
        <!-- Metadatos de idioma, codificación y adaptación a pantallas. -->
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reto 2DAW - Notificaciones</title>

        <!-- Fuentes e iconos de FontAwesome -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <!-- Estilos compartidos con el panel de equipamientos y de esta lista. -->
        <link rel="stylesheet" href="../css/AEquipamientos.css">
        <link rel="stylesheet" href="../css/Notificaciones.css">
        <script src=""></script>
    </head>
    <body>
        <main id="main">
            <!-- Sección que presenta la lista de notificaciones enviadas. -->
            <section class="notificaciones-lista">
                <div class="notificaciones-lista__controles">
                    <h1>Enviadas</h1>
                    <!-- Acciones disponibles para buscar o filtrar la lista. -->
                    <div class="notificaciones-lista__acciones">
                        <button type="button" class="notificaciones-lista__accion">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> Search
                        </button>
                        <button type="button" class="notificaciones-lista__accion">
                            <i class="fa-solid fa-filter" aria-hidden="true"></i> Filtros
                        </button>
                    </div>
                </div>
                <!-- Tabla con los datos de las notificaciones. -->
                <div class="notificaciones-lista__tabla">
                    <table>
                        <!-- Encabezados de las columnas de la lista. -->
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Mensaje</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <!-- Filas que se rellenarán con los datos de las notificaciones. -->
                        <tbody>
                            <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <!-- Pie de página. -->
        <footer id="footer"></footer>
    </body>
</html>
