<!DOCTYPE html>
<html>
    <head lang="es">
        <!-- Metadatos de idioma, codificación y adaptación a pantallas. -->
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Creacion de notificaciones</title>
        <!-- Hojas de estilo que definen la apariencia general y la de notificaciones. -->
        <link rel="stylesheet" href="../css/Main.css">
        <link rel="stylesheet" href="../css/Notificaciones.css">
        <script src=""></script>
    </head>
    <body>
        <!-- Cabecera con controles de inicio y salida. -->
        <header id="header">
            <div id="inicio"><- Inicio</div> <div id="salir">Salir</div>
        </header>
        <!-- Navegación principal entre las secciones de administración. -->
        <nav id="nav">
            <div>Equipamientos</div><div>Ubicaciones</div><div>Usuarios</div><div>Notificaciones</div>
        </nav>
        <main id="main">
            <!-- Formulario para redactar y enviar una notificación. -->
            <form action="" method="get">
                <h1>Crear notificaciones</h1>
                <!-- Datos del usuario al que se dirige la notificación. -->
                <div>Buscar usuario:<br>
                <input type="text" name="Nombre Usuario" id="nom_user"></div>
                <div>Destinatario:<br>
                <input type="text" name="Destinatario" id="destinatario"></div>
                <!-- Mensaje que recibirá el destinatario. -->
                <div>Mensaje:<br>
                <textarea id="mensaje" name="Mensaje" rows="5" cols="30"></textarea></div>
                <!-- Estado inicial o de seguimiento de la notificación. -->
                <div>Estado:<br>
                <select name="Estado" id="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="proceso">En proceso</option>
                    <option value="completado">Completado</option>
                </select></div>
                <!-- Envía los datos del formulario. -->
                <div><br><input type="submit" value="Enviar"></div>
            </form>
        </main>
        <!-- Pie de página. -->
        <footer id="footer">Lo que sea</footer>
    </body>
</html>
