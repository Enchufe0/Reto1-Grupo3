<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reto 2DAW - Equipamientos</title>
    
    <!-- Fuentes e iconos de FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Enlace a tu archivo CSS -->
    <link rel="stylesheet" href="../css/AEquipamientos.css">
</head>
<body>

    <!-- NAVEGACIÓN SUPERIOR (Opcional, si quieres usar la suya) -->
    <nav class="top-navbar">
        <div class="nav-tabs">
            <a href="#" class="active">Equipamiento</a>
            <a href="#">Ubicaciones</a>
            <a href="#">Historial</a>
            <a href="#">Usuarios</a>
        </div>

        <div class="nav-logo-center">
            <img src="img/logo.svg" alt="Logo" class="login-logo-img">
            <div class="login-logo-text">r d e n z a</div>
        </div>

        <div class="nav-profile">
            <i class="fa-regular fa-bell bell"></i>
            <div class="user-avatar">AD</div>
            <div class="dropdown-container">
                <div class="admin-dropdown">
                    Administración <i class="fa-solid fa-chevron-down" style="font-size: 10px; color: #6b7280; margin-left: 5px;"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div class="eq-header">
            <h1 class="eq-title">Inventario de equipamientos</h1>
        </div>

        <!-- Tarjetas de estadísticas superiores -->
        <div class="eq-stats-bar">
            <div class="eq-stat">
                <i class="fa-solid fa-box" style="color: #9ca3af;"></i>
                <span class="stat-number" id="stat-total">0</span> equipos registrados
            </div>
            <div class="eq-stat-divider"></div>
            <div class="eq-stat">
                <i class="fa-solid fa-layer-group" style="color: #9ca3af;"></i>
                <span class="stat-number" id="stat-categories">0</span> categorías
            </div>
            <div class="eq-stat-divider"></div>
            <div class="eq-stat">
                <i class="fa-solid fa-location-dot" style="color: #9ca3af;"></i>
                <span class="stat-number" id="stat-locations">0</span> ubicaciones
            </div>
        </div>

        <!-- Buscador, filtros y botón de añadir -->
        <div class="eq-filters-bar">
            <div class="eq-search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #9ca3af;"></i>
                <input type="text" id="search-input" placeholder="Buscar por nombre, ID o marca...">
            </div>
            
            <select id="filter-category" class="eq-select">
                <option value="">Categoría: Todas</option>
                <option value="PORTATIL">Portátil</option>
                <option value="SOBREMESA">Sobremesa</option>
                <option value="PERIFERICO">Periférico</option>
                <option value="AUDIOVISUAL">Audiovisual</option>
                <option value="OTROS">Otros</option>
            </select>

            <select id="filter-location" class="eq-select">
                <option value="">Ubicación: Todas</option>
            </select>

            <button class="eq-btn-primary" id="btn-crear-equipamiento">
                <i class="fa-solid fa-plus"></i> Crear equipamiento
            </button>
        </div>

        <!-- Contenedor de la tabla -->
        <div class="eq-table-container">
            <table class="eq-table">
                <thead>
                    <tr>
                        <th style="width: 50px;"><input type="checkbox"></th>
                        <th style="width: 80px;">ID <i class="fa-solid fa-arrow-down" style="font-size: 10px;"></i></th>
                        <th>Nombre</th>
                        <th>Marca</th>
                        <th>Categoría</th>
                        <th>Ubicación</th>
                        <th style="text-align: right;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="eq-table-body">
                    <!-- Aquí el JS inyectará las filas (<tr>) -->
                </tbody>
            </table>
        </div>

        <!-- Paginación -->
        <div class="eq-footer">
            <span id="eq-showing-text">Mostrando 0 de 0 equipamientos</span>
            <div class="eq-pagination">
                <button class="eq-page-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="eq-page-btn active">1</button>
                <button class="eq-page-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </main>

    <!-- Modal (Pop-up para crear) -->
    <div id="modal-crear" class="eq-modal" style="display: none;">
        <div class="eq-modal-content">
            <h3>Nuevo Equipamiento</h3>
            <form id="form-crear-eq">
                <input type="text" id="new-nombre" placeholder="Nombre" required>
                <input type="text" id="new-marca" placeholder="Marca" required>
                <input type="text" id="new-modelo" placeholder="Modelo" required>
                <input type="text" id="new-desc" placeholder="Descripción" required>
                <select id="new-categoria">
                    <option value="PORTATIL">Portátil</option>
                    <option value="SOBREMESA">Sobremesa</option>
                    <option value="PERIFERICO">Periférico</option>
                    <option value="AUDIOVISUAL">Audiovisual</option>
                    <option value="OTROS">Otros</option>
                </select>
                <div class="eq-modal-actions">
                    <button type="button" class="eq-btn-secondary">Cancelar</button>
                    <button type="submit" class="eq-btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
