<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Ubicaciones</title>
    
    <!-- Fuentes e iconos de FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div class="header-ubi">
            <h1 class="titulo-ubi">Gestión de Ubicaciones</h1>
            <p class="subtitulo-ubi">Consulta y organiza los espacios y aulas del centro</p>
        </div>

        <!-- Tarjetas de estadísticas -->
        <div class="ubi-barra-estadisticas">
            <div class="ubi-estadisticas">
                <i class="fa-solid fa-map-location-dot"></i> 
                <span class="estadistica-numero" id="estadisticaTotal">0</span> 
                <span class="estadistica-barra">espacios en total</span>
            </div>
            <div class="ubi-estadisticas-division"></div>
            <div class="ubi-estadisticas">
                <i class="fa-solid fa-chalkboard-user"></i>
                <span class="estadistica-numero">3</span> 
                <span class="estadistica-barra">aulas registradas</span>
            </div>
            <div class="ubi-estadisticas-division"></div>
            <div class="ubi-estadisticas">
                <i class="fa-solid fa-calendar-plus"></i>
                <span class="estadistica-numero">5</span> 
                <span class="estadistica-barra">nuevos este mes</span>
            </div>
        </div>

        <!-- Buscador y botón de añadir -->
        <div class="ubi-filtro-buscador">
            <div class="ubi-buscador">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscarUbicacion" placeholder="Buscar aula o espacio...">
            </div>
            
            <button class="ubi-boton-añadir" id="btnAñadir">
                Añadir Ubicación
                <i class="fa-solid fa-plus"></i> 
            </button>
        </div>

        <!-- Contenedor blanco para las ubicaciones -->
        <div class="ubi-contenedor-tabla" id="contenedorUbicaciones">
            <!--Aqui se meten las ubicaciones-->
        </div>

        <!-- 1. POP-UP AÑADIR -->
        <div id="modalAnadir" class="ubi-modal" style="display: none;">
            <div class="ubi-modal-contenido">
                <h3>Añadir Nueva Ubicación</h3>
                <form id="formAnadir">
                    <div class="ubi-form-grupo">
                        <label for="nuevoNombre">Nombre</label>
                        <input type="text" id="nuevoNombre" required>
                    </div>
                    <div class="ubi-form-grupo">
                        <label for="nuevaDesc">Descripción</label>
                        <input type="text" id="nuevaDesc" required>
                    </div>
                    <div class="ubi-modal-acciones">
                        <button type="button" class="ubi-btn-cancelar" id="btnCancelarAnadir">Cancelar</button>
                        <button type="submit" class="ubi-btn-guardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 2. POP-UP EDITAR -->
        <div id="modalEditar" class="ubi-modal" style="display: none;">
            <div class="ubi-modal-contenido">
                <h3>Editar Ubicación</h3>
                <form id="formEditar">
                    <input type="hidden" id="editarId"> 
                    <div class="ubi-form-grupo">
                        <label for="editarNombre">Nombre</label>
                        <input type="text" id="editarNombre" required>
                    </div>
                    <div class="ubi-form-grupo">
                        <label for="editarDesc">Descripción</label>
                        <input type="text" id="editarDesc" required>
                    </div>
                    <div class="ubi-modal-acciones">
                        <button type="button" class="ubi-btn-cancelar" id="btnCancelarEditar">Cancelar</button>
                        <button type="submit" class="ubi-btn-guardar">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 3. POP-UP ELIMINAR -->
        <div id="modalEliminar" class="ubi-modal" style="display: none;">
            <div class="ubi-modal-contenido">
                <h3>¿Eliminar Ubicación?</h3>
                <p class="ubi-texto-eliminar">¿Estás seguro de que quieres eliminar esta ubicación? Esta acción no se puede deshacer.</p>
                <input type="hidden" id="eliminarId">
                <div class="ubi-modal-acciones">
                    <button type="button" class="ubi-btn-cancelar" id="btnCancelarEliminar">Cancelar</button>
                    <button type="button" class="ubi-btn-peligro" id="btnConfirmarEliminar">Eliminar</button>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
